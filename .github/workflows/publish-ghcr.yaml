name: Docker Image CI for GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
   runs-on: ubuntu-latest
   
   steps:
      - uses: actions/checkout@v3
      - name: Build and  push image
        run: |
          docker login --username julietadallapozza --password ${{ secrets.GH_PAT}} ghcr.io
          docker build -t ghcr.io/julietadallapozza/hello-world-ghcr:latest 
          docker push ghcr.io/julietadallapozza/hello-world-ghcr:latest
